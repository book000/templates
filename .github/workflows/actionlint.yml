name: Actionlint

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/*"
  merge_group:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # GitHub Actions の background/wait-all は 2026-06-25 導入済みだが、
          # actionlint v1.7.12 は未対応のため、その既知誤検知だけを除外する。
          ./actionlint -color -shellcheck= \
            -ignore='unexpected.*key.*background' \
            -ignore='step.*must.*run.*script.*with.*run.*section.*or.*run.*action.*with.*uses.*section'
