name: Actionlint

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/*"
  merge_group:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -shellcheck= \
            -ignore 'unexpected\s+key\s+"background"\s+for\s+step\s+to\s+run\s+shell\s+command' \
            -ignore 'step\s+must\s+run\s+script\s+with\s+"run"\s+section\s+or\s+run\s+action\s+with\s+"uses"\s+section'
