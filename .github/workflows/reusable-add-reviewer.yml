name: Auto add reviewer

on:
  workflow_call:
    inputs:
      actors:
        description: 対象のアクター（カンマ区切り）
        type: string
        default: dependabot[bot],renovate[bot],github-actions[bot],book000
      reviewers:
        description: レビュアー（カンマ区切り）
        type: string
        default: book000
      light-runs-on:
        description: 軽量ジョブのランナーラベル（ubuntu-slim、ubuntu-latest など）
        type: string
        default: ubuntu-slim

permissions:
  contents: read
  pull-requests: write

jobs:
  add-reviewer:
    runs-on: ${{ inputs.light-runs-on }}

    steps:
      - name: Setup
        id: setup
        run: |
          # 注意: ワークフロー式（inputs の値）はシェルの解釈前に展開されるため、入力は信頼できる呼び出し元のものに限る
          ACTORS=$(printf '%s' "${{ inputs.actors }}" | jq -R -c 'split(",") | map(select(length > 0) | ltrimstr(" ") | rtrimstr(" "))')
          echo "actors: $ACTORS"
          echo "is-need-add-reviewer=$(printf '%s' "$ACTORS" | jq -r --arg actor "${{ github.actor }}" '. | contains([$actor]) | not')" >> "$GITHUB_OUTPUT"

      - name: Add reviewer
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: ${{ steps.setup.outputs.is-need-add-reviewer == 'true' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.requestReviewers({
              ...context.repo,
              pull_number: context.issue.number,
              reviewers: "${{ inputs.reviewers }}".split(",")
            })
