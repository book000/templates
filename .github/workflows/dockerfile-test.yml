name: Test Dockerfile

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - "dockerfiles/**"
      - ".github/workflows/dockerfile-test.yml"
  merge_group:

jobs:
  list-files:
    runs-on: ubuntu-latest

    outputs:
      files: ${{ steps.list-files.outputs.files }}

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 📄 List Dockefile files
        id: list-files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          SELF: .github/workflows/dockerfile-test.yml
        run: |
          # Emit the names of Dockerfiles to test as a JSON array named files.
          # Select all Dockerfiles when the SHAs are unknown or this workflow changed;
          # otherwise select changed Dockerfiles and Dockerfiles whose test app changed.
          all() { ls dockerfiles/*.Dockerfile | sed -E 's#^dockerfiles/(.+)\.Dockerfile$#\1#'; }
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            names=$(all)
          else
            changed=$(git diff --diff-filter=ACM --name-only "$BASE_SHA" "$HEAD_SHA")
            if printf '%s\n' "$changed" | grep -Fxq "$SELF"; then
              names=$(all)
            else
              names=$({
                printf '%s\n' "$changed" | sed -nE 's#^dockerfiles/([^/]+)\.Dockerfile$#\1#p'
                printf '%s\n' "$changed" | sed -nE 's#^dockerfiles/tests/([^/]+)/.*#\1#p'
              } | sort -u | while read -r n; do [ -f "dockerfiles/$n.Dockerfile" ] && echo "$n"; done || true)
            fi
          fi
          files=$(printf '%s\n' "$names" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$files"
          echo "files=$files" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    needs: list-files
    if: needs.list-files.outputs.files != '[]'

    strategy:
      matrix:
        file: ${{ fromJson(needs.list-files.outputs.files) }}
      fail-fast: false

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 🧪 Test
        id: test
        run: |
          # If dockerfiles/tests/<File>/ exists, move into it and run docker build
          # <File> is the file name without the extension
          if [ -d "dockerfiles/tests/${{ matrix.file }}" ]; then
            cp dockerfiles/${{ matrix.file }}.Dockerfile dockerfiles/tests/${{ matrix.file }}/Dockerfile
            cd dockerfiles/tests/${{ matrix.file }}

            docker build -t test .
            docker run --name test test
            docker export -o test.tar test
            docker rm test

            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.test.outputs.success == 'true'
        with:
          name: ${{ matrix.file }}.tar
          path: |
            dockerfiles/tests/${{ matrix.file }}/test.tar
