name: hadolint

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - "dockerfiles/**"
      - ".github/workflows/dockerfile-lint.yml"
  merge_group:

jobs:
  list-files:
    runs-on: ubuntu-latest

    outputs:
      files: ${{ steps.list-files.outputs.files }}

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 📄 List Dockefile files
        id: list-files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          SELF: .github/workflows/dockerfile-lint.yml
        run: |
          # Emit the names of Dockerfiles to lint as a JSON array named files.
          # Select all Dockerfiles when the SHAs are unknown or this workflow changed;
          # otherwise select the changed Dockerfiles.
          all() { printf '%s\n' dockerfiles/*.Dockerfile | sed -E 's#^dockerfiles/(.+)\.Dockerfile$#\1#'; }
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            names=$(all)
          else
            changed=$(git diff --diff-filter=ACM --name-only "$BASE_SHA" "$HEAD_SHA")
            if printf '%s\n' "$changed" | grep -Fxq "$SELF"; then
              names=$(all)
            else
              names=$(printf '%s\n' "$changed" | sed -nE 's#^dockerfiles/([^/]+)\.Dockerfile$#\1#p' | sort -u)
            fi
          fi
          files=$(printf '%s\n' "$names" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$files"
          echo "files=$files" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    needs: list-files
    if: needs.list-files.outputs.files != '[]'

    strategy:
      matrix:
        file: ${{ fromJson(needs.list-files.outputs.files) }}
      fail-fast: false

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Docker build check
        run: |
          docker build --check -f dockerfiles/${{ matrix.file }}.Dockerfile .

      - name: 🐳 hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: dockerfiles/${{ matrix.file }}.Dockerfile
