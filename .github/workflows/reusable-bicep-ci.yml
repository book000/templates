name: Bicep CI

on:
  workflow_call:
    inputs:
      bicep-file:
        description: Path to the Bicep file
        type: string
        default: infra/main.bicep
      bicepparam-file:
        description: Path to the Bicep parameter file
        type: string
        default: infra/main.bicepparam

permissions:
  contents: read

jobs:
  bicep-ci:
    name: Bicep CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bicep CLI
        # Assumes az is preinstalled on GitHub-hosted ubuntu-latest runners
        run: az bicep install

      # Pass inputs through environment variables instead of expanding them into the shell script
      - name: az bicep lint
        env:
          BICEP_FILE: ${{ inputs.bicep-file }}
        run: az bicep lint --file "$BICEP_FILE"

      - name: az bicep build
        env:
          BICEP_FILE: ${{ inputs.bicep-file }}
        run: az bicep build --file "$BICEP_FILE" --stdout > /dev/null

      - name: az bicep build-params
        env:
          BICEPPARAM_FILE: ${{ inputs.bicepparam-file }}
        run: az bicep build-params --file "$BICEPPARAM_FILE" --stdout > /dev/null
