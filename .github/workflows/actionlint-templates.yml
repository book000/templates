name: Actionlint templates

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
    paths:
      - "workflows/**"
      - ".github/workflows/actionlint.yml"
  merge_group:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Move workflow files
        run: |
          rm -v .github/workflows/*
          # The templates use pull_request_target on purpose, so drop the repository config that enables the security rules
          rm -v .github/jactionlint.yaml
          # Ignore workflow files in subdirectories
          cp -v workflows/* .github/workflows/ || true

      - name: Run jactionlint
        uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0
        with:
          profile: correctness
          args: --shellcheck=
