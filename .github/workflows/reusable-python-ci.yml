name: Python CI

on:
  workflow_call:
    inputs:
      directory:
        description: Target directory
        type: string
        default: .
      python-version:
        description: Python version. If empty, uses {directory}/.python-version when it exists, otherwise 3.x
        type: string
        default: ""
      requirements-file:
        description: requirements file path relative to the target directory (skipped if it does not exist)
        type: string
        default: requirements.txt
      disabled-jobs:
        description: Disable jobs (comma separated. compile, ruff, format, test)
        type: string
        default: "NULL"
      install-apt-packages:
        description: Install apt packages (space separated)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  python-ci:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📃 Setup
        id: setup
        env:
          INPUT_DIRECTORY: ${{ inputs.directory }}
          INPUT_PYTHON_VERSION: ${{ inputs.python-version }}
          INPUT_DISABLED_JOBS: ${{ inputs.disabled-jobs }}
        run: |
          # Pass inputs through environment variables instead of expanding them into the shell script
          disabled=",${INPUT_DISABLED_JOBS//[[:space:]]/},"
          for job in compile ruff format test; do
            if [[ "$disabled" == *",${job},"* ]]; then
              echo "disabled-${job}=true" >> "$GITHUB_OUTPUT"
            else
              echo "disabled-${job}=false" >> "$GITHUB_OUTPUT"
            fi
          done

          if [ -n "$INPUT_PYTHON_VERSION" ]; then
            echo "python-version=$INPUT_PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          elif [ -f "$INPUT_DIRECTORY/.python-version" ]; then
            echo "python-version-file=$INPUT_DIRECTORY/.python-version" >> "$GITHUB_OUTPUT"
          else
            echo "python-version=3.x" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏗 Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.setup.outputs.python-version }}
          python-version-file: ${{ steps.setup.outputs.python-version-file }}

      - name: 👨🏻‍💻 Install apt packages
        if: inputs.install-apt-packages != ''
        env:
          INPUT_APT_PACKAGES: ${{ inputs.install-apt-packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $INPUT_APT_PACKAGES

      - name: 👨🏻‍💻 Install dependencies
        working-directory: ${{ inputs.directory }}
        env:
          INPUT_REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: |
          if [ -f "$INPUT_REQUIREMENTS_FILE" ]; then
            python -m pip install -r "$INPUT_REQUIREMENTS_FILE"
          else
            echo "$INPUT_REQUIREMENTS_FILE not found. Skip installing dependencies."
          fi

      - name: 🏃 Compile check
        if: steps.setup.outputs.disabled-compile == 'false'
        working-directory: ${{ inputs.directory }}
        run: python -m compileall -q -x '/(\.git|\.venv|venv|node_modules)/' .

      - name: 👀 Run ruff check
        if: steps.setup.outputs.disabled-ruff == 'false'
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: ${{ inputs.directory }}
          args: check

      - name: 🎨 Run ruff format check
        if: steps.setup.outputs.disabled-format == 'false'
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: ${{ inputs.directory }}
          args: format --check

      - name: 🧪 Run tests
        if: steps.setup.outputs.disabled-test == 'false'
        working-directory: ${{ inputs.directory }}
        run: |
          python -m pip install pytest
          # Treat "no tests collected" (exit code 5) as success
          python -m pytest || { code=$?; [ "$code" -eq 5 ] && echo "No tests collected." || exit "$code"; }
