name: Check typescript-eslint TypeScript 7 support

# Purpose: periodically detect whether typescript-eslint supports TypeScript 7.
#
# Background: TypeScript 7 (the native Go compiler) does not provide tsc internal APIs
# such as ts.Extension.Cjs, so typescript-eslint crashes in startup code that depends on
# them, and its peerDependencies.typescript range excludes TypeScript 7.
#
# renovate/base.json temporarily blocks major typescript updates, so to notice when
# support lands, check weekly whether the peerDependencies.typescript of typescript-eslint
# on npm now allows TypeScript 7, and open an Issue only when it does.

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check typescript-eslint peer range
    runs-on: ubuntu-latest
    permissions:
      issues: write # To open an Issue when support is detected

    steps:
      - name: Install semver
        run: npm install --global semver

      - name: Check typescript-eslint peerDependencies.typescript range
        id: check
        run: |
          RANGE=$(npm view typescript-eslint peerDependencies.typescript)
          if [ -z "$RANGE" ]; then
            echo "::error::Could not get peerDependencies.typescript of typescript-eslint"
            exit 1
          fi

          SUPPORTS_TS7=$(node -e "
            const semver = require('$(npm root -g)/semver');
            console.log(semver.intersects(process.argv[1], '>=7.0.0', { includePrerelease: true }));
          " "$RANGE")

          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "supports_ts7=$SUPPORTS_TS7" >> "$GITHUB_OUTPUT"

      - name: Check for existing tracking issue
        if: steps.check.outputs.supports_ts7 == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list --repo "${{ github.repository }}" \
            --search "TypeScript 7 in:title" --state open --json number --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Create tracking issue
        if: steps.check.outputs.supports_ts7 == 'true' && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RANGE: ${{ steps.check.outputs.range }}
        run: |
          # Use single quotes so the Markdown backticks are passed to printf literally instead of being command-substituted
          # shellcheck disable=SC2016
          BODY=$(printf '`peerDependencies.typescript` of typescript-eslint was updated to `%s` and may now allow TypeScript 7.\n\nCheck whether the temporary major-update block rule for typescript in renovate/base.json can be removed.\n\n- Detected by: the `check-typescript-eslint-ts7-support` workflow of this repository\n- What to check: verify that ESLint works with `typescript@7.x` and the latest `typescript-eslint` in one target repository before removing the rule' "$RANGE")
          gh issue create --repo "${{ github.repository }}" \
            --title "typescript-eslint may now support TypeScript 7 — consider removing the Renovate block rule" \
            --assignee book000 \
            --body "$BODY"
