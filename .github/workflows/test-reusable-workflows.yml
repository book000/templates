name: Test Reusable Workflows

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-nodejs-ci:
    name: Test reusable-nodejs-ci
    uses: ./.github/workflows/reusable-nodejs-ci.yml
    with:
      directorys: "test-scenarios/nodejs-yarn"
      disabled-jobs: "depcheck"  # Skip depcheck to avoid test failures
      check-git-diff: false

  test-nodejs-ci-pnpm:
    name: Test reusable-nodejs-ci-pnpm
    uses: ./.github/workflows/reusable-nodejs-ci-pnpm.yml
    with:
      directorys: "test-scenarios/nodejs-pnpm"
      disabled-jobs: "depcheck"  # Skip depcheck to avoid test failures
      check-git-diff: false

  test-maven:
    name: Test reusable-maven
    uses: ./.github/workflows/reusable-maven.yml
    permissions:
      contents: write
      actions: read
    with:
      is-merged: false
      is-release: false
      directory: test-scenarios/maven

  test-actionlint:
    name: Test reusable-actionlint
    uses: ./.github/workflows/reusable-actionlint.yml

  test-hadolint:
    name: Test reusable-hadolint-ci
    uses: ./.github/workflows/reusable-hadolint-ci.yml

  test-python-ci:
    name: Test reusable-python-ci
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      directory: test-scenarios/python

  test-shellcheck-ci:
    name: Test reusable-shellcheck-ci
    uses: ./.github/workflows/reusable-shellcheck-ci.yml
    with:
      directory: test-scenarios/docker

  test-bicep-ci:
    name: Test reusable-bicep-ci
    uses: ./.github/workflows/reusable-bicep-ci.yml
    with:
      bicep-file: test-scenarios/bicep/infra/main.bicep
      bicepparam-file: test-scenarios/bicep/infra/main.bicepparam

  test-add-reviewer:
    name: Test reusable-add-reviewer
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/reusable-add-reviewer.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      actors: "github-actions[bot],test-user"
      reviewers: "github-actions[bot]"

  # Negative test: confirm that "Ignored build scripts" is detected when allowBuilds is not set
  # Reusable workflows do not support continue-on-error, so the script is tested directly
  test-nodejs-ci-pnpm-ignored-build:
    name: Test Ignored build scripts detection
    runs-on: ubuntu-latest
    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
          package_json_file: test-scenarios/nodejs-pnpm-ignored-build-scripts/package.json

      - name: 🏗 Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: test-scenarios/nodejs-pnpm-ignored-build-scripts/.node-version

      - name: 📂 Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: 📂 Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-ignored-build-test-${{ hashFiles('test-scenarios/nodejs-pnpm-ignored-build-scripts/pnpm-lock.yaml') }}

      - name: 👨🏻‍💻 Install dependencies (expected to fail because of Ignored build scripts)
        id: install
        continue-on-error: true
        working-directory: test-scenarios/nodejs-pnpm-ignored-build-scripts
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile --prefer-frozen-lockfile 2>&1 | tee /tmp/pnpm-install.log
          if grep -qF "Ignored build scripts" /tmp/pnpm-install.log; then
            echo ""
            echo "::error::pnpm ignored build scripts. Add them to allowBuilds in pnpm-workspace.yaml:"
            grep "Ignored build scripts" /tmp/pnpm-install.log
            exit 1
          fi

      - name: ✅ Confirm Ignored build scripts detection
        run: |
          if [[ "${{ steps.install.outcome }}" != "failure" ]]; then
            echo "❌ Detection test failed: the install step did not fail (outcome: ${{ steps.install.outcome }})"
            echo "   The install step should fail and be detected when a dependency such as esbuild has no allowBuilds entry"
            exit 1
          fi
          if ! grep -qF "Ignored build scripts" /tmp/pnpm-install.log; then
            echo "❌ Detection test failed: 'Ignored build scripts' was not found in the log"
            echo "   The install step may have failed for another reason"
            cat /tmp/pnpm-install.log
            exit 1
          fi
          echo "✅ Detection of Ignored build scripts works"

  # Test the Docker workflow (dry run without pushing)
  test-docker:
    name: Test reusable-docker
    uses: ./.github/workflows/reusable-docker.yml
    permissions:
      contents: write
      actions: read
      packages: write
      deployments: write
    with:
      targets: |
        [
          {
            "packageName": "test-package",
            "imageName": "test-image",
            "context": "test-scenarios/docker",
            "file": "test-scenarios/docker/Dockerfile"
          }
        ]
      is-merged: false
      is-release: false
    secrets:
      DOCKER_USERNAME: ${{ github.actor }}
      DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # Aggregates all test jobs. Keep " Finished" in the name: book000/sync-repo-settings prefers
  # job names containing "finished" when auto-detecting required checks.
  test-summary:
    name: Test Summary Finished
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test-nodejs-ci
      - test-nodejs-ci-pnpm
      - test-nodejs-ci-pnpm-ignored-build
      - test-maven
      - test-actionlint
      - test-hadolint
      - test-bicep-ci
      - test-add-reviewer
      - test-docker

    steps:
      - name: Check test results
        run: |
          echo "Node.js CI result: ${{ needs.test-nodejs-ci.result }}"
          echo "Node.js CI pnpm result: ${{ needs.test-nodejs-ci-pnpm.result }}"
          echo "Node.js CI pnpm (ignored build scripts detection) result: ${{ needs.test-nodejs-ci-pnpm-ignored-build.result }}"
          echo "Maven result: ${{ needs.test-maven.result }}"
          echo "Actionlint result: ${{ needs.test-actionlint.result }}"
          echo "Hadolint result: ${{ needs.test-hadolint.result }}"
          echo "Bicep CI result: ${{ needs.test-bicep-ci.result }}"
          echo "Add Reviewer result: ${{ needs.test-add-reviewer.result }}"
          echo "Docker result: ${{ needs.test-docker.result }}"

          # Check that no positive test failed (skipped is OK for add-reviewer when not on a PR)
          if [[ "${{ needs.test-nodejs-ci.result }}" != "success" ]] || \
             [[ "${{ needs.test-nodejs-ci-pnpm.result }}" != "success" ]] || \
             [[ "${{ needs.test-nodejs-ci-pnpm-ignored-build.result }}" != "success" ]] || \
             [[ "${{ needs.test-maven.result }}" != "success" ]] || \
             [[ "${{ needs.test-actionlint.result }}" != "success" ]] || \
             [[ "${{ needs.test-hadolint.result }}" != "success" ]] || \
             [[ "${{ needs.test-bicep-ci.result }}" != "success" ]] || \
             [[ "${{ needs.test-add-reviewer.result }}" == "failure" ]] || \
             [[ "${{ needs.test-docker.result }}" != "success" ]]; then
            echo "❌ Some reusable workflow tests failed!"
            exit 1
          else
            echo "✅ All reusable workflow tests passed!"
          fi