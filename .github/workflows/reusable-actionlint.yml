name: Actionlint with reviewdog

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # jactionlint natively supports the background/wait-all step keys, so no ignore patterns are needed.
      # Pinning the action by commit SHA also pins the jactionlint version (the release the action was published with).
      - name: Run jactionlint
        uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0
        with:
          profile: correctness
          # Never run the online checks, so a caller's config file cannot make the job call the GitHub API.
          online: "false"
