name: Actionlint with reviewdog

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run actionlint (Push)
        if: ${{ github.event_name == 'push' }}
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # actionlint does not support background/wait-all yet, so ignore only those known false positives (remove once supported).
          ./actionlint -color \
            -ignore='unexpected.*key.*background' \
            -ignore='step.*must.*run.*script.*with.*run.*section.*or.*run.*action.*with.*uses.*section'

      - name: Run actionlint (Pull-Request)
        if: ${{ github.event_name == 'pull_request' }}
        uses: reviewdog/action-actionlint/dockerless@a7d35aaf8c309203a4ae861d32b7bd490baa7bf3 # v1.83.0
        with:
          fail_level: error
          # INPUT_ACTIONLINT_FLAGS is split by the shell, so use a regular expression without spaces.
          actionlint_flags: >-
            -ignore=unexpected.*key.*background
            -ignore=step.*must.*run.*script.*with.*run.*section.*or.*run.*action.*with.*uses.*section
