name: Actionlint with reviewdog

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run actionlint (Push)
        if: ${{ github.event_name == 'push' }}
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # GitHub Actions の background/wait-all は 2026-06-25 導入済みだが、
          # actionlint v1.7.12 は未対応のため、その既知誤検知だけを除外する。
          ./actionlint -color \
            -ignore='unexpected.*key.*background' \
            -ignore='step.*must.*run.*script.*with.*run.*section.*or.*run.*action.*with.*uses.*section'

      - name: Run actionlint (Pull-Request)
        if: ${{ github.event_name == 'pull_request' }}
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          fail_level: error
          # INPUT_ACTIONLINT_FLAGS は shell word splitting されるため、空白なしの RE2 にする。
          actionlint_flags: >-
            -ignore=unexpected.*key.*background
            -ignore=step.*must.*run.*script.*with.*run.*section.*or.*run.*action.*with.*uses.*section
